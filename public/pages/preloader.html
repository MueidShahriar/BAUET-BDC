<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preloader - BAUET BDC</title>
    <link rel="icon" href="../image/blood-drop.png" type="image/png">
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #page-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #page-loader .logo-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
        }

        #page-loader .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        #page-loader .logo-base {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.18;
            filter: grayscale(1);
        }

        #page-loader .logo-fill {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            clip-path: inset(100% 0 0 0);
            animation: loadUp 1000ms ease-in-out forwards;
        }

        @keyframes loadUp {
            0% {
                clip-path: inset(100% 0 0 0);
            }
            100% {
                clip-path: inset(0 0 0 0);
            }
        }

        body.loading > *:not(#page-loader):not(script) {
            opacity: 0 !important;
            visibility: hidden !important;
        }
    </style>
</head>
<body class="loading">
    <div id="page-loader">
        <div class="logo-wrapper">
            <div class="logo-base">
                <img src="../image/blood-drop.png" width="512" height="512" alt="" decoding="async" />
            </div>
            <div class="logo-fill">
                <img src="../image/blood-drop.png" width="512" height="512" alt="Loading" decoding="async" />
            </div>
        </div>
    </div>

    <script type="module">
        import { initPreloader } from '../assets/js/modules/preloader.js?v=11';
        initPreloader();
    </script>
    <script type="module" src="../assets/js/visitor-stats-page.js"></script>
</body>
</html>
